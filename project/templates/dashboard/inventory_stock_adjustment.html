{% extends 'base.html' %}
{% block title %}{{ title }} - Glamour{% endblock %}
{% block content %}
<div class="bg-surface-container-lowest rounded-[24px] p-gutter shadow-[0_4px_20px_rgba(213,31,134,0.04)] max-w-md mx-auto">
    <div class="text-center mb-stack-lg">
        <div class="w-20 h-20 rounded-full bg-primary/10 flex items-center justify-center mx-auto">
            <span class="material-symbols-outlined text-[40px] text-primary">compare_arrows</span>
        </div>
        <h2 class="font-headline-md text-headline-md text-on-background mt-stack-sm">{{ title }}</h2>
    </div>
    
    <div class="bg-background rounded-xl p-4 mb-stack-lg">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <p class="font-label-sm text-secondary">المنتج</p>
                <p class="font-body-md text-primary">{{ product.name }}</p>
            </div>
            <div>
                <p class="font-label-sm text-secondary">الكمية المتوفرة</p>
                <p class="font-body-md">{{ inventory.quantity }}</p>
            </div>
        </div>
    </div>
    
    <form method="post" class="space-y-stack-md">
        {% csrf_token %}
        <div>
            <label class="block font-label-md text-secondary mb-stack-sm">نوع الجرد</label>
            <select name="adjustment_type" required class="w-full px-4 py-2 rounded-xl border border-secondary-container focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-200">
                <option value="">اختر النوع</option>
                <option value="stock_addition">إضافة (جرد موجب)</option>
                <option value="stock_deduction">خصم (جرد سالب)</option>
            </select>
        </div>
        <div>
            <label class="block font-label-md text-secondary mb-stack-sm">الكمية</label>
            <input type="number" name="quantity" min="1" required class="w-full px-4 py-2 rounded-xl border border-secondary-container focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-200">
            <p class="font-label-sm text-secondary mt-1">الحد الأقصى للخصم: {{ inventory.quantity }}</p>
        </div>
        <div>
            <label class="block font-label-md text-secondary mb-stack-sm">ملاحظات (اختياري)</label>
            <textarea name="notes" rows="3" class="w-full px-4 py-2 rounded-xl border border-secondary-container focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-200"></textarea>
        </div>
        <div class="flex flex-col sm:flex-row gap-stack-md pt-stack-md">
            <button type="submit" class="bg-primary text-on-primary px-6 py-2 rounded-xl hover:bg-primary/90 transition-all duration-200 font-label-md">تأكيد الجرد</button>
            <a href="{% url 'inventory_list' %}" class="border border-secondary-container px-6 py-2 rounded-xl hover:bg-secondary-container/50 transition-all duration-200 font-label-md text-center">إلغاء</a>
        </div>
    </form>
</div>
{% endblock %}
