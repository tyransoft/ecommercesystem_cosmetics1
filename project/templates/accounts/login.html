<!-- templates/dashboard/login.html -->
{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Glamour</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "background": "#f8f9ff",
                        "primary": "#af006b",
                        "primary-container": "#d51f86",
                        "on-primary": "#ffffff",
                        "on-background": "#0b1c30",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#5f5e5e",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "outline": "#8c7079",
                        "surface-variant": "#d3e4fe",
                        "surface-container": "#e5eeff",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background: #f8f9ff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(213,31,134,0.08);
            border: 1px solid rgba(213,31,134,0.06);
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 150px;
            height: 150px;
            background: rgba(175,0,107,0.04);
            border-radius: 50%;
        }
        .login-card::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 200px;
            height: 200px;
            background: rgba(213,31,134,0.03);
            border-radius: 50%;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }
        .login-logo h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #af006b;
            margin: 0;
        }
        .login-logo p {
            color: #5f5e5e;
            font-size: 14px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #0b1c30;
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #d3e4fe;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
            background: #f8f9ff;
            color: #0b1c30;
        }
        .form-control:focus {
            outline: none;
            border-color: #af006b;
            box-shadow: 0 0 0 4px rgba(175,0,107,0.08);
            background: #ffffff;
        }
        .form-control::placeholder {
            color: #8c7079;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #af006b;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }
        .login-btn:hover {
            background: #8c0055;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(175,0,107,0.25);
        }
        .login-btn:active {
            transform: scale(0.97);
        }
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        .alert-danger {
            background: #ffdad6;
            color: #93000a;
            border: 1px solid rgba(186,26,26,0.15);
        }
        .decor-circles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .decor-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.04;
        }
        .decor-circle.c1 {
            width: 400px;
            height: 400px;
            background: #af006b;
            top: -100px;
            right: -100px;
        }
        .decor-circle.c2 {
            width: 300px;
            height: 300px;
            background: #d51f86;
            bottom: -80px;
            left: -80px;
        }
        .decor-circle.c3 {
            width: 200px;
            height: 200px;
            background: #ffb0ce;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
            .login-logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="decor-circles">
        <div class="decor-circle c1"></div>
        <div class="decor-circle c2"></div>
        <div class="decor-circle c3"></div>
    </div>
    <div class="login-card">
        <div class="login-logo">
            <h1>Glamour</h1>
            <p>تسجيل الدخول إلى لوحة التحكم</p>
        </div>
        
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" autofocus required>
            </div>
            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>
    </div>
</body>
</html>
