{% extends 'base.html' %}
{% block title %}{{ title }} - Glamour{% endblock %}
{% block content %}
<div class="bg-surface-container-lowest rounded-[24px] p-gutter shadow-[0_4px_20px_rgba(213,31,134,0.04)] max-w-2xl mx-auto">
    <h2 class="font-headline-md text-headline-md text-on-background mb-stack-lg">{{ title }}</h2>
    <form method="post" class="space-y-stack-md">
        {% csrf_token %}
        <div>
            <label class="block font-label-md text-secondary mb-stack-sm">اسم العمولة</label>
            <input type="text" name="name" value="{{ commission.name|default:'' }}" required class="w-full px-4 py-2 rounded-xl border border-secondary-container focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-200">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block font-label-md text-secondary mb-stack-sm">من قيمة</label>
                <input type="number" name="min_amount" step="0.01" value="{{ commission.min_amount|default:'' }}" required class="w-full px-4 py-2 rounded-xl border border-secondary-container focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-200">
            </div>
            <div>
                <label class="block font-label-md text-secondary mb-stack-sm">إلى قيمة </label>
                <input type="number" name="max_amount" step="0.01" value="{{ commission.max_amount|default:'' }}" class="w-full px-4 py-2 rounded-xl border border-secondary-container focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-200">
            </div>
        </div>
        <div>
            <label class="block font-label-md text-secondary mb-stack-sm">نسبة العمولة %</label>
            <input type="number" name="percentage" step="0.01" value="{{ commission.percentage|default:'' }}" required class="w-full px-4 py-2 rounded-xl border border-secondary-container focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-200">
        </div>
        <div>
            <label class="block font-label-md text-secondary mb-stack-sm">القيمة الثابتة</label>
            <input type="number" name="fixed_amount_lyd" step="0.01" value="{{ commission.fixed_amount_lyd |default:'' }}"  class="w-full px-4 py-2 rounded-xl border border-secondary-container focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-200">
        </div>
        <div class="flex flex-col sm:flex-row gap-stack-md pt-stack-md">
            <button type="submit" class="bg-primary text-on-primary px-6 py-2 rounded-xl hover:bg-primary/90 transition-all duration-200 font-label-md">حفظ</button>
            <a href="{% url 'external_commission_list' %}" class="border border-secondary-container px-6 py-2 rounded-xl hover:bg-secondary-container/50 transition-all duration-200 font-label-md text-center">إلغاء</a>
        </div>
    </form>
</div>
{% endblock %}
