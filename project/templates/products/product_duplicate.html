{% extends 'base.html' %}
{% block title %}نسخ منتج - Glamour{% endblock %}
{% block content %}

<div class="max-w-lg mx-auto">
  <div class="bg-white rounded-2xl border border-gray-100 p-6">
    <h2 class="text-lg font-bold text-gray-800 mb-5">نسخ المنتج: {{ product.name }}</h2>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-sm text-gray-600 mb-1">اسم المنتج الجديد</label>
        <input type="text" name="name" value="{{ product.name }} - نسخة"
               class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-pink-500 focus:outline-none focus:ring-2 focus:ring-pink-500/20">
      </div>

      <p class="text-xs text-gray-400">سيتم نسخ جميع البيانات والنسخ مع باركود جديد لكل نسخة.</p>

      <div class="flex gap-3 pt-2">
        <button type="submit" class="bg-pink-600 text-white px-6 py-2 rounded-xl hover:bg-pink-700 transition font-semibold text-sm">نسخ</button>
        <a href="{% url 'product_list' %}" class="border border-gray-300 text-gray-600 px-6 py-2 rounded-xl hover:bg-gray-50 transition font-semibold text-sm">إلغاء</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
